spring:
  application:
    name: testimonial

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testimonial}
    username: ${SPRING_DATASOURCE_USERNAME:testimonial}
    password: ${SPRING_DATASOURCE_PASSWORD:testimonial}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (PRD 8). Hibernate only validates that the
      # entities match what Flyway already applied.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Never baseline. With baseline-on-migrate=true, Flyway silently marks a
    # non-empty schema as baseline and SKIPS the migrations, leaving tables
    # missing and failing ddl-auto=validate with a confusing error. Flyway
    # owns the schema outright (PRD 8).
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
    from: ${MAIL_FROM_ADDRESS:no-reply@example.com}

  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholder defaults keep the application context bootable when
            # Google credentials are absent (CI, tests, public endpoints).
            # Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in the environment
            # to enable Google sign-in for real.
            client-id: ${GOOGLE_CLIENT_ID:placeholder-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-not-configured}
            scope:
              - openid
              - profile
              - email

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  auth:
    # Sessions are a short-lived access JWT plus a rotating refresh token,
    # both delivered in HttpOnly cookies. Override AUTH_JWT_SECRET in any
    # deployed environment.
    jwt-secret: ${AUTH_JWT_SECRET:development-only-secret-change-me-in-production}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    access-token-cookie: session
    refresh-token-cookie: refresh
    # Cookies require HTTPS in production. Disabled locally so the cookies
    # work over plain HTTP on localhost.
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@example.com}
    # When false, MailService writes the message to the log instead of
    # sending it. Set to true (with MAIL_HOST) to send real email.
    smtp-configured: ${MAIL_SMTP_CONFIGURED:false}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # The Stripe price for the Premium plan. Without it there is nothing to
    # check out, and the Billing page says so rather than failing (PRD 4.9).
    premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}
    # Where Stripe sends the user back to. The redirect does not change the
    # plan -- only a verified webhook does (PRD 4.9).
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/billing?checkout=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/billing?checkout=cancelled}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  submission:
    # Public testimonial submissions are rate limited per IP address
    # (PRD 4.5). The browser test suite shares one IP, so the local
    # development backend is usually run with a raised capacity.
    rate-limit-capacity: ${SUBMISSION_RATE_LIMIT_CAPACITY:5}
    rate-limit-refill-seconds: ${SUBMISSION_RATE_LIMIT_REFILL_SECONDS:10}
    # Off by default: without a proxy in front, X-Forwarded-For is
    # client-supplied and could be used to forge a rate-limit key.
    trust-proxy: ${SUBMISSION_TRUST_PROXY:false}
    honeypot-field: companyWebsite

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.yamin.testimonial: ${LOG_LEVEL:INFO}
